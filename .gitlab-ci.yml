stages:
  - lint
  - test

cache:
  paths:
    - vendor/

before_script:
  - bash ci/docker_install.sh > /dev/null

# ── Lint stage ──────────────────────────────────────────────

phpstan:
  image: php:8.3
  stage: lint
  script:
    - vendor/bin/phpstan analyse --no-progress --error-format=gitlab > phpstan-report.json
  artifacts:
    expire_in: 1 week
    reports:
      codequality: phpstan-report.json

cs-fixer:
  image: php:8.3
  stage: lint
  script:
    - vendor/bin/php-cs-fixer fix --dry-run --diff --format=gitlab > cs-fixer-report.json
  artifacts:
    expire_in: 1 week
    reports:
      codequality: cs-fixer-report.json

# ── Test stage ──────────────────────────────────────────────

test:8.2:
  image: php:8.2
  stage: test
  script:
    - vendor/bin/phpunit --log-junit .phpunit.cache/results.xml
  artifacts:
    expire_in: 1 week
    reports:
      junit: .phpunit.cache/results.xml

test:8.3:
  image: php:8.3
  stage: test
  script:
    - vendor/bin/phpunit --log-junit .phpunit.cache/results.xml
  artifacts:
    expire_in: 1 week
    reports:
      junit: .phpunit.cache/results.xml

test:8.4:
  image: php:8.4
  stage: test
  script:
    - vendor/bin/phpunit --log-junit .phpunit.cache/results.xml
  artifacts:
    expire_in: 1 week
    reports:
      junit: .phpunit.cache/results.xml
